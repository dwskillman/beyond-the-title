      ...writes.filter((p) => p.backup).map((p) => ({ rel: p.backup, data: p.oldText, kind: 'backup', of: p.rel })),
      ...writes.filter((p) => p.kind === 'bytes'),
      ...writes.filter((p) => p.kind === 'blob' || p.kind === 'text'),
      ...writes.filter((p) => p.kind === 'json')
    ];
    for (let i = 0; i < ordered.length; i++) {
      const w = ordered[i];

  }

  function packageFiles(store, { includeVideos = true, siteData = null } = {}) {
    const ts = Util.nowIso(), files = [], skippedVideos = [];

    if (siteData) files.push({ path: 'data/site-data.js', data: siteData });

      `Created ${new Date().toLocaleString()} by ${GENERATOR}`,
      '',
      'HOW TO APPLY THIS UPDATE',
      '1. Unzip this package (double-click it in Finder).',
      '2. Open your Beyond the Title project folder.',
      `3. Copy the ${siteData ? 'four' : 'three'} files inside this package's "data" folder into your project's "data" folder.`,
      '   Choose "Replace" when Finder asks. Keep a copy of your old stories.json first if you want a backup.',
      folders.length ? '4. For each folder inside this package\'s "stories" folder:' : '4. (No story files in this package.)',
      folders.length ? '   - If your project has no folder with that name yet, copy the whole folder into your project\'s "stories" folder.' : '',
      folders.length ? '   - If it already exists, open both folders and copy the FILES across. Do not replace the folder itself:' : '',
      folders.length ? '     Finder\'s "Replace" would delete files already in it (such as transcripts or videos).' : '',
      skippedVideos.length ? '5. Videos were left out of this package. Copy each one into place yourself and rename it:' : '',
      ...skippedVideos.map((v) => `   - ${v.name}  →  ${v.path}`),
      '',
      'FILES IN THIS PACKAGE',
      `- data/stories.json  (${Util.plural(store.stories.length, 'story', 'stories')})`,
      `- data/people.json   (${Util.plural(store.people.length, 'person', 'people')})`,

  }

  return { loadFromEntries, loadFromHandle, loadInto, initializeFolder, planSave, executeSave, packageFiles, readFile, writeFile, indexHandle, sameIgnoringMeta };
})();

/* ==========================================================================
   Diagnostics: real capability tests, not assumptions
   ========================================================================== */
const Diagnostics = (() => {
  const results = new Map();
  let browser = null;
  const r = (status, detail) => ({ status, detail });
  const pass = (d) => r('pass', d), warn = (d) => r('warn', d), fail = (d) => r('fail', d), info = (d) => r('info', d);

  async function getBrowser() {
    const ua = navigator.userAgent; let name = '', version = '', platform = '';
    try {
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        const d = await navigator.userAgentData.getHighEntropyValues(['fullVersionList', 'platformVersion', 'architecture']);
        const brands = (d.fullVersionList || []).filter((b) => !/Not.?A.?Brand/i.test(b.brand));
        const pick = brands.find((b) => /Google Chrome/.test(b.brand)) || brands.find((b) => /Edge/.test(b.brand)) || brands.find((b) => /Chrom/.test(b.brand)) || brands[0];
        if (pick) { name = pick.brand; version = pick.version; }
        const plat = d.platform || navigator.userAgentData.platform || '';
        platform = [plat === 'macOS' ? 'macOS' : plat, d.platformVersion || '', d.architecture ? `(${d.architecture})` : ''].filter(Boolean).join(' ');
      }
    } catch (e) { /* fall back to UA string */ }
    if (!version) {
      const m = ua.match(/(Edg|HeadlessChrome|Chrome|Firefox|Version)\/([\d.]+)/);
      if (m) { name = m[1] === 'Edg' ? 'Microsoft Edge' : m[1] === 'Version' ? 'Safari' : m[1]; version = m[2]; }
    }
    if (!platform) platform = /Mac OS X/.test(ua) ? 'macOS' : /Windows/.test(ua) ? 'Windows' : navigator.platform || '';
    return { name: name || 'Unknown browser', version, platform, chromium: /Chrom|Edge/i.test(name + ua) };
  }

      else if (S.dirHandle) file = await ProjectIO.readFile(S.dirHandle, path);
    } catch (e) { file = null; }

async function importJsonFiles(fileList) {

  for (const f of files) {
    if (f.size > MAX_JSON_BYTES) { errors.push(`${f.name}: too large.`); continue; }
    const p = S.parseJson(await f.text());
    if (!p.ok) errors.push(`${f.name}: ${p.error}`);
    else if (parsed[p.kind]) errors.push(`${f.name}: more than one ${p.kind} file was chosen.`);

  }
  if (errors.length) return alertModal('Nothing was imported', h('ul', { class: 'change-list' }, errors.map((e) => h('li', null, icon('xCircle'), e))), { iconName: 'xCircle', tone: 'danger' });
  if (parsed.stories && !(await confirmDiscardIfNeeded('Importing this stories.json'))) return;

  if (parsed.stories) { S.loadedHashes = {}; S.assetIndex = S.mode === 'direct' || S.mode === 'readonly' ? S.assetIndex : null; if (S.mode === 'none') S.mode = 'standalone'; }

  toast(`Imported ${Object.values(parsed).map((p) => `${p.fileName} (${Util.plural(p.list.length, 'record')})`).join(', ')}.`, 'success');
  if (res.renumbered.length) toast(`Unsaved drafts renumbered: ${res.renumbered.map((r) => r.join(' → ')).join(', ')}.`, 'warn', 10000);
  if (warnings.length) alertModal('Imported, with notes', h('ul', { class: 'change-list' }, warnings.map((w) => h('li', null, icon('alert'), w))), { iconName: 'alert', tone: 'warn' });
  scheduleChrome();
}

/** One row per field: what the story has now, what Copilot suggests, and whether to apply it. */

async function filesFromDrop(dt) {
  const entries = [...(dt.items || [])].map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
  if (!entries.some((e) => e.isDirectory)) return [...dt.files];
  const out = [];

    if (entry.name.startsWith('.')) return;
    if (entry.isFile) out.push(await new Promise((res, rej) => entry.file(res, rej)));
    else if (entry.isDirectory && depth < 4) {
      const reader = entry.createReader(); let batch;
      do { batch = await new Promise((res, rej) => reader.readEntries(res, rej)); for (const e of batch) await walk(e, depth + 1); } while (batch.length);
    }
  };

}

  const txt = files.filter((f) => /\.txt$/i.test(f.name));
  const media = files.filter((f) => ['video', 'captions', 'thumbnail'].includes(Media.kindOf(f.name)));
  const ignored = files.length - txt.length - media.length;
  const results = txt.length ? await importTranscriptFiles(txt, { navigate: navigate && !media.length }) : [];
  // Stories created (or re-found) by this import: media dropped with them is paired with them if names don't match.
  const together = results.filter((r) => r.storyId && (r.status === 'imported' || r.status === 'duplicate')).map((r) => S.get(r.storyId)).filter(Boolean);
  if (media.length) await attachMediaFiles(media, { together });
  if (ignored) toast(`${Util.plural(ignored, 'other file')} ignored. Only .txt transcripts, .mp4/.m4v/.mov videos, .vtt captions and images are used.`, 'info');
  if (navigate && media.length) go('#/media');
}

/** Link files already sitting in stories/<id>/ (for example copied in by hand). */

async function reopenLastFolder() {

  try { perm = await handle.requestPermission({ mode: 'readwrite' }); } catch (e) { perm = 'denied'; }
  if (perm !== 'granted') { try { perm = (await handle.requestPermission({ mode: 'read' })) === 'granted' ? 'read' : 'denied'; } catch (e) { perm = 'denied'; } }
  if (perm === 'denied') { toast('Chrome didn\'t allow access to that folder. Use Open Project Folder instead.', 'warn'); return; }
  try { const res = await ProjectIO.loadFromHandle(S, handle, perm === 'granted'); afterLoad(res, perm === 'granted' ? 'Project folder reopened.' : 'Project folder reopened read-only.'); }
  catch (e) { alertModal('Couldn\'t reopen the folder', h('p', null, explainError(e) + ' It may have been moved or renamed. Use Open Project Folder.'), { iconName: 'xCircle', tone: 'danger' }); FolderMemory.forget(); UIState.lastFolder = null; scheduleChrome(); }

/** Inline Markdown: **bold**, *italic*, `code`. Always text nodes, never HTML. */
function mdInline(text) {
  const out = [];
  const re = /(\*\*[^*]+\*\*|`[^`]+`|\*[^*\s][^*]*\*)/g; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    const t = m[0];
    out.push(t.startsWith('**') ? h('b', null, t.slice(2, -2)) : t.startsWith('`') ? h('code', null, t.slice(1, -1)) : h('em', null, t.slice(1, -1)));
    last = m.index + t.length;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}

  for (const raw of String(md).replace(/\r\n?/g, '\n').split('\n')) {

    if ((m = /^(#{1,3})\s+(.*)$/.exec(line))) {

      if (m[1].length === 2) toc.push({ id, text: m[2] });
      continue;
    }
    if (/^\|.*\|$/.test(line.trim())) {
      flushPara(); list = null;
      const cells = line.trim().slice(1, -1).split('|').map((c) => c.trim());
      if (cells.every((c) => /^:?-{3,}:?$/.test(c))) continue; // header separator row
      if (!table) {

  async function run() {
    const t0 = performance.now(), results = [];
    for (const x of tests) {
      try { await x.fn(); results.push({ name: x.name, ok: true }); }
      catch (e) { results.push({ name: x.name, ok: false, error: e && e.message ? e.message : String(e) }); }
    }
    const failed = results.filter((r) => !r.ok);
    return { total: results.length, passed: results.length - failed.length, failed: failed.length, failures: failed.map((f) => f.name), results, ms: Math.round(performance.now() - t0) };
  }
  return { run, count: () => tests.length };
})();

function viewSelfTest() {
  const out = h('pre', { id: 'selftest-output', class: 'code', 'data-status': 'running', style: 'white-space:pre-wrap;max-height:none' }, 'Running self-tests…');
  SelfTest.run().then((r) => {
    selfTestResult = r; Diagnostics.setSelfTest(r);
    out.dataset.status = r.failed ? 'fail' : 'pass';
    document.documentElement.dataset.selftest = r.failed ? 'fail' : 'pass';
    out.textContent = `SELFTEST ${r.failed ? 'FAIL' : 'PASS'} ${r.passed}/${r.total} (${r.ms} ms)\n` + r.results.map((x) => `${x.ok ? 'ok  ' : 'FAIL'} ${x.name}${x.ok ? '' : '\n     ' + x.error}`).join('\n');
  });
  return [pageHead({ eyebrow: 'Diagnostics', title: 'Built-in self-tests', lede: 'Synthetic data only. Your project is not touched.' }), out];
}

/* ==========================================================================
   Demo routes (synthetic sample data, used for screenshots and walkthroughs)
   ========================================================================== */
let demoRunning = false;
async function runDemo(variant) {
  if (demoRunning) return;
  demoRunning = true;
  try { await runDemoInner(variant); } finally { demoRunning = false; }
}
async function runDemoInner(variant) {
  if (!S.stories.length) await loadSamples({ navigate: false });
  const s = S.stories[0];
  // Samples arrive with name, headline, description, quote and tags filled from the transcript; the demo adds
  // what Copilot would normally supply (job title, team, manager) so every screen has something to show.
  if (variant !== 'raw' && !s.role) {
    const t = prepareTranscript(S.transcripts.get(s.id));
    const hl = t.headlines.find((x) => x.kind === 'quote') || t.headlines[0];
    if (hl) { S.set(s, 'headline', Quote.stripEdges(hl.text)); S.set(s, 'headlineSource', hl.kind === 'quote' ? 'quote' : 'template'); }
    const q = t.analysis.candidates.find((c) => /best ideas/.test(c.text)) || t.analysis.candidates[0];
    if (q) { S.set(s, 'quote', q.text); const v = Quote.verify(q.text, t); S.set(s, 'quoteTimestamp', Util.hms(v.start)); S.set(s, 'quoteStart', v.start); }
    S.set(s, 'tags', t.analysis.tags.slice(0, 3).map((x) => x.tag));
    S.set(s, 'role', 'Learning Designer'); S.set(s, 'teamId', S.ensureTeam('Learning Design')); S.set(s, 'managerId', S.ensureManager('Quinn Manager-Example'));
    S.set(s, 'project', 'Team Hub');
    S.set(s, 'fieldSources', Object.assign({}, s.fieldSources || {}, { role: 'copilot', team: 'copilot', manager: 'copilot' }));
    S.syncPerson(s);
  }
  if (variant === 'featured') { S.set(s, 'featured', true); ED.previewMode = 'featured'; }
  const target = { stories: '#/stories', dashboard: '#/dashboard', import: '#/import', export: '#/export', diagnostics: '#/diagnostics' }[variant] || '#/story/' + s.id;
  location.replace(target);
}

/* ==========================================================================
   Boot
   ========================================================================== */
function setupDragDrop() {
  const overlay = $('#drop-overlay'); let depth = 0;
  const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', (e) => { if (!hasFiles(e) || document.querySelector('dialog[open]')) return; depth++; overlay.hidden = false; });
  window.addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) overlay.hidden = true; });
  window.addEventListener('dragover', (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = document.querySelector('dialog[open]') ? 'none' : 'copy'; });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; overlay.hidden = true;
    if (document.querySelector('dialog[open]')) return;
    filesFromDrop(e.dataTransfer).then((files) => { if (files.length) importAny(files); }).catch((err) => toast('Couldn\'t read the dropped items: ' + explainError(err), 'error'));
  });
}
function boot() {
  S.listeners.add(scheduleChrome);
  window.addEventListener('hashchange', () => renderRoute());
  window.addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', window.scrollY > 4), { passive: true });
  window.addEventListener('beforeunload', (e) => { if (S.hasUnsaved()) { e.preventDefault(); e.returnValue = ''; } });
  setupDragDrop();
  renderRoute();
  FolderMemory.get().then((h0) => { if (h0) { UIState.lastFolder = h0; scheduleChrome(); } });
  Diagnostics.runPassive().then(() => { if (['dashboard', 'diagnostics'].includes(UIState.route) && !document.querySelector('dialog[open]')) renderRoute(true); });
  window.BTT = Object.freeze({ VERSION, Util, Decode, Parser, Analyzer, Quote, Headlines, Descriptions, Copilot, nameFromTranscript, fillFromTranscript, Zip, ProjectIO, Diagnostics, SelfTest, makeStore, buildTurns, prepareTranscript, makeTranscriptState, isSafeRelPath, sha256Hex, sha256Js, store: S, ready: true });
}
boot();
})();
